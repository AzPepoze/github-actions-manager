name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build Binary
        run: make build

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: bin/github-actions-manager
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
